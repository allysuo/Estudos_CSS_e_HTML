<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página principal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="login-container">
        <h1>Escola Online</h1>
        <p class="subtitle">Faça seu login!</p>
    

        <div class="login-section">
            <h2 for="usuario_aluno">Usuário aluno:</h2>
            <form action="aluno.html" method="POST">
                <input type="text" id="usuario_aluno" name="usuario_aluno" placeholder="Digite seu nome" required>


                <label for="aluno.html"></label>
                <input type="password" id="password" name="senha_aluno" placeholder="Digite sua senha" required>

                <button type="submit"><a href="aluno.html">Entrar</a></button>
            </form>
        </div>

        <hr class="divisao">

        <div class="login-section">
            <h2 for="usuario_professor">Usuário professor:</h2>
            <form action="professor.html" method="POST">
                <input type="text" id="usuario_professor" name="usuario_professor" placeholder="Digite seu nome" required>

                <label for="aluno.html"></label>
                <input type="password" id="password" name="senha_aluno" placeholder="Digite sua senha" required>

                <button type="submit"><a href="professor.html">Entrar</a></button>
            </form>
        </div>
    </div>
</body>
</html>
